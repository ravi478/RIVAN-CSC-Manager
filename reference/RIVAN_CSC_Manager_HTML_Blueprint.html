<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#087f45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RIVAN CSC Manager — Mobile App</title>
<style>
:root {
  --primary: #087f45;
  --primary-dark: #063b25;
  --primary-light: #e6f4ed;
  --bg: #f2f5f3;
  --card: #ffffff;
  --text: #14211b;
  --muted: #607068;
  --border: #dfe7e2;
  --danger: #d94a4a;
  --warning: #d88913;
  --info: #2563a6;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg: #0c120f;
  --card: #161f1b;
  --text: #eaf2ee;
  --muted: #93a39b;
  --border: #26332c;
  --primary-light: #1b3026;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  overflow-x: hidden;
  width: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; touch-action: manipulation; }
.hidden { display: none !important; }

/* Login Screen */
.login-wrap {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: linear-gradient(145deg, var(--primary-dark), var(--primary));
}
.login-card {
  background: var(--card); color: var(--text); width: min(410px, 100%);
  border-radius: 26px; padding: 28px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}
.login-logo {
  width: 62px; height: 62px; border-radius: 18px; background: var(--primary);
  color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 21px; margin: 0 auto 12px;
  box-shadow: 0 8px 20px rgba(8,127,69,0.3);
}
.role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; margin: 18px 0; }
.role-tabs button { padding: 11px; border-radius: 10px; font-weight: 700; background: transparent; color: var(--muted); transition: .2s; }
.role-tabs button.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

/* App Layout */
.app { min-height: 100dvh; display: flex; width: 100%; }
.sidebar {
  width: 270px; background: var(--primary-dark); color: #fff;
  position: fixed; left: 0; top: 0; bottom: 0; padding: calc(18px + var(--safe-top)) 14px 24px;
  z-index: 50; overflow-y: auto; transition: transform .28s cubic-bezier(.4,0,.2,1);
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding: 4px 6px; }
.logo { width: 44px; height: 44px; border-radius: 13px; background: #fff; color: var(--primary); display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
.brand h1 { font-size: 16.5px; line-height: 1.2; }
.brand small { opacity: .78; font-size: 11px; display: block; }
.nav-group { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #8ab8a2; margin: 14px 10px 6px; font-weight: 700; }
.nav { display: grid; gap: 4px; }
.nav button {
  background: transparent; color: #d9eee3; text-align: left; padding: 11px 12px;
  border-radius: 12px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500;
}
.nav button.active, .nav button:hover { background: var(--primary); color: #fff; font-weight: 700; }
.nav-badge { margin-left: auto; background: #d94a4a; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 800; }

.main { margin-left: 270px; width: calc(100% - 270px); min-height: 100dvh; display: flex; flex-direction: column; }
.top {
  height: calc(60px + var(--safe-top)); padding-top: var(--safe-top);
  background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding-left: 16px; padding-right: 16px;
  position: sticky; top: 0; z-index: 30; backdrop-filter: blur(8px);
}
.top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.menu-btn { display: none; width: 40px; height: 40px; border-radius: 12px; background: var(--bg); font-size: 19px; place-items: center; flex-shrink: 0; }
.top h2 { font-size: 16.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
.iconbtn {
  width: 38px; height: 38px; border-radius: 12px; background: var(--bg);
  display: grid; place-items: center; position: relative; font-size: 16px;
}
.dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }
.avatar {
  padding: 0 11px; height: 38px; border-radius: 12px; background: var(--primary);
  color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 5px;
}

.content { padding: 16px; max-width: 1380px; width: 100%; margin: 0 auto; flex: 1; }

/* Hero & Cards */
.hero {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff;
  border-radius: 22px; padding: 18px; display: flex; justify-content: space-between;
  gap: 14px; align-items: center; box-shadow: 0 10px 26px rgba(8,127,69,0.22); margin-bottom: 16px;
}
.hero h3 { font-size: 18.5px; margin-bottom: 3px; }
.hero p { opacity: .9; font-size: 12.5px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .quick { background: #fff; color: var(--primary); padding: 10px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; }
.hero .quick.outline { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.32); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  padding: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.03);
}
.label { font-size: 11.5px; color: var(--muted); font-weight: 600; display: block; }
.value { font-size: 21px; font-weight: 850; margin-top: 4px; }
.subtext { font-size: 11px; color: var(--muted); margin-top: 3px; }
.green { color: #087f45; } .red { color: #d94a4a; } .orange { color: #d88913; } .blue { color: #2563a6; }

.grid2 { display: grid; grid-template-columns: 1.3fr .9fr; gap: 14px; margin-bottom: 16px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
.panel h3 { font-size: 15.5px; font-weight: 800; }

/* Charts */
.bars { height: 165px; display: flex; align-items: flex-end; gap: 8px; padding-top: 22px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 34px; background: linear-gradient(180deg, #18a765, var(--primary)); border-radius: 7px 7px 3px 3px; min-height: 16px; transition: height .3s; }
.bar-val { font-size: 9.5px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.bar-lbl { font-size: 10.5px; color: var(--muted); margin-top: 5px; font-weight: 600; }

.quickgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.q {
  padding: 13px; border: 1px solid var(--border); border-radius: 15px;
  background: var(--bg); text-align: left; transition: transform .12s;
}
.q:active { transform: scale(0.97); }
.q b { display: block; margin: 4px 0 2px; font-size: 13px; }
.q small { color: var(--muted); font-size: 11px; }

/* Toolbar, Inputs & Buttons */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.search {
  flex: 1; min-width: 160px; height: 42px; padding: 0 13px; border: 1px solid var(--border);
  border-radius: 12px; outline: none; background: var(--card); font-size: 13.5px;
}
.search:focus { border-color: var(--primary); }
.btn {
  height: 40px; padding: 0 14px; border-radius: 12px; background: var(--primary); color: #fff;
  font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 11.5px; border-radius: 9px; }
.btn.secondary { background: var(--primary-light); color: var(--primary); }
.btn.danger { background: #fde8e8; color: #c53030; }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn.warning { background: #fef3c7; color: #b45309; }

/* Tables & Badges */
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 18px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
.table th { background: var(--bg); color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .3px; }
.table tr:last-child td { border-bottom: 0; }
.badge { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pending, .late { background: #fff1d5; color: #a86600; }
.processing, .half { background: #e0f0ff; color: #17619b; }
.completed, .active, .present, .paid, .approved { background: #dff6e8; color: #087f45; }
.inactive, .rejected, .cancelled, .absent, .unpaid, .suspended { background: #fde8e8; color: #b91c1c; }
.refunded { background: #f3e8ff; color: #6b21a8; }

/* Tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 14px; border-radius: 11px; background: var(--card); border: 1px solid var(--border); font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Modals & Forms */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
  align-items: center; justify-content: center; padding: 14px; z-index: 60; backdrop-filter: blur(3px);
}
.modal.show { display: flex; }
.modalbox {
  background: var(--card); width: min(580px, 100%); max-height: 90dvh;
  overflow-y: auto; border-radius: 22px; padding: 20px; animation: pop .22s ease;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}
@keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.field { display: grid; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 700; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 11px; outline: none; background: var(--bg); font-size: 14px;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: var(--card); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Receipt Print Box */
.receipt-paper {
  background: #fff; color: #111; border: 2px dashed #cbd5e1; border-radius: 16px;
  padding: 18px; font-family: 'Courier New', monospace, sans-serif;
}
.receipt-paper h2 { color: #087f45; font-family: sans-serif; font-size: 18px; }
.r-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dotted #e2e8f0; font-size: 12.5px; }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + var(--safe-bottom));
  background: #063b25; color: #fff; padding: 11px 18px; border-radius: 99px; display: none; z-index: 100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-size: 13px; font-weight: 600; max-width: 92vw; text-align: center;
}
.toast.show { display: block; animation: pop .2s; }

/* Mobile Drawer & Bottom Nav */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 45; display: none; backdrop-filter: blur(2px); }
.backdrop.show { display: block; }
.bottom { display: none; }

/* ==================== RESPONSIVE MOBILE APP EXPERIENCE ==================== */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; width: 100%; }
  .menu-btn { display: grid; }
  .content { padding: 12px 12px calc(86px + var(--safe-bottom)); }
  .grid2 { grid-template-columns: 1fr; }
  .formgrid { grid-template-columns: 1fr; }
  .hero { flex-direction: column; align-items: stretch; padding: 16px; }
  .hero-actions { display: grid; grid-template-columns: 1fr 1fr; }
  .hero .quick { text-align: center; }
  .cards { grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .card { padding: 12px; border-radius: 16px; }
  .value { font-size: 19px; }

  /* Bottom App Navigation Bar */
  .bottom {
    position: fixed; display: flex; left: 0; right: 0; bottom: 0;
    height: calc(64px + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
    background: var(--card); border-top: 1px solid var(--border); z-index: 35;
    justify-content: space-around; align-items: center;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.07);
  }
  .bottom button {
    background: none; color: var(--muted); font-size: 10.5px; flex: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600;
  }
  .bottom button.active { color: var(--primary); font-weight: 800; }
  .bottom button span { font-size: 20px; line-height: 1; }
  .bottom .fab {
    width: 52px; height: 52px; border-radius: 50%; background: var(--primary);
    color: #fff; font-size: 26px; display: grid; place-items: center;
    margin-top: -24px; box-shadow: 0 6px 18px rgba(8,127,69,0.4); flex: none;
    border: 3px solid var(--card);
  }
}

/* Mobile Card Conversion for Tables (Zero Horizontal Scroll on Phones!) */
@media (max-width: 768px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar .search, .toolbar .btn { width: 100%; max-width: 100% !important; }

  /* Bottom-Sheet Style Modals on Mobile */
  .modal { align-items: flex-end; padding: 0; }
  .modalbox {
    width: 100%; max-height: 92dvh; border-radius: 24px 24px 0 0;
    padding: 18px 16px calc(22px + var(--safe-bottom));
    animation: slideUp .25s cubic-bezier(.2,.8,.2,1);
  }
  .modalbox::before {
    content: ""; display: block; width: 42px; height: 4px; border-radius: 99px;
    background: var(--border); margin: -6px auto 12px;
  }
  .modal-actions { flex-direction: column-reverse; }
  .modal-actions .btn, .modal-actions a.btn { width: 100%; height: 44px; }

  /* Responsive Card-Tables */
  .tablewrap.mobile-cards { background: transparent; border: none; overflow: visible; }
  .tablewrap.mobile-cards .table,
  .tablewrap.mobile-cards thead,
  .tablewrap.mobile-cards tbody,
  .tablewrap.mobile-cards tr,
  .tablewrap.mobile-cards td { display: block; width: 100%; }
  .tablewrap.mobile-cards thead { display: none; }
  .tablewrap.mobile-cards tr {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .tablewrap.mobile-cards td {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px dashed var(--border); text-align: right; font-size: 13px;
  }
  .tablewrap.mobile-cards td:last-child {
    border-bottom: none; padding-top: 10px; justify-content: flex-end; flex-wrap: wrap;
  }
  .tablewrap.mobile-cards td::before {
    content: attr(data-label);
    font-size: 11.5px; font-weight: 700; color: var(--muted); text-align: left; flex-shrink: 0;
  }
  .tablewrap.mobile-cards td[data-label=""]::before { display: none; }
}

@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: fixed; left: 0; top: 0; width: 100%; border: none; }
}
</style>
</head>

function saveDB(auditAction, module, detail) {
  if (auditAction) {
    db.auditLogs.unshift({
      id: "AUD-" + String(db.auditLogs.length + 1).padStart(3, "0"),
      user: db.auth.userName,
      role: db.auth.role.toUpperCase(),
      action: auditAction,
      module: module || "System",
      detail: detail || "",
      time: nowStr()
    });
  }
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function nowStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10) + " " + d.toTimeString().slice(0, 5);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove("show"), 2600);
}
function openModal(title, bodyHtml) {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modalbox"><div class="modal-head"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>${bodyHtml}</div>`;
  m.classList.add("show");
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }
function val(id) { return (document.getElementById(id)?.value || "").trim(); }

function doLogin(role) {
  if (role === "admin") {
    db.auth = { loggedIn: true, role: "admin", userId: "ADMIN-01", userName: "Ravi Kumar", cscId: "ALL", device: "Mobile App" };
    saveDB("Admin Login", "Security", "Admin logged in");
    ui.view = "dashboard";
    render();
    toast("Welcome Admin Ravi Kumar!");
  } else {
    const opId = val("opLoginSelect");
    const op = db.operators.find(o => o.id === opId);
    if (!op) return toast("Operator not found");
    if (op.status !== "Active") return toast(`Access Blocked: Status is "${op.status}"`);
    db.auth = { loggedIn: true, role: "operator", userId: op.id, userName: op.name, cscId: op.cscId, device: "Mobile App" };
    saveDB("Operator Login", "Security", `${op.name} (${op.id}) logged in`);
    ui.view = "dashboard";
    render();
    toast(`Namaste ${op.name}!`);
  }
}

  saveDB("Logout", "Security", `${db.auth.userName} logged out`);
  db.auth.loggedIn = false;

  render();
}

  </div>
  <div class="panel" id="printArea">

    <div class="tablewrap mobile-cards">
      <table class="table">
        ${buildReportTable(ui.reportType)}
      </table>
    </div>
  </div>`;

function buildReportTable(type) {
  const data = db[type] || [];
  if (!data.length) return `<tr><td>No records available.</td></tr>`;
  const keys = Object.keys(data[0]).filter(k => typeof data[0][k] !== "object");
  return `<thead><tr>${keys.map(k => `<th>${k.toUpperCase()}</th>`).join("")}</tr></thead>
          <tbody>${data.map(row => `<tr>${keys.map(k => `<td data-label="${k.toUpperCase()}">${esc(row[k])}</td>`).join("")}</tr>`).join("")}</tbody>`;
}

function exportCSV(type) {
  const data = db[type] || [];
  if (!data.length) return toast("No data to export");
  const keys = Object.keys(data[0]).filter(k => typeof data[0][k] !== "object");
  const csv = [keys.join(","), ...data.map(r => keys.map(k => `"${String(r[k] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `RIVAN_${type}_${todayStr()}.csv`;
  a.click();
  toast("CSV Report downloaded!");
}

function saveApplication() {
  const cust = db.customers.find(c => c.id === val("apCust"));
  const srv = db.services.find(s => s.id === val("apSrv"));
  const amt = Number(val("apAmt") || 0);
  const status = val("apStat");
  const mode = val("apMode");
  const ref = val("apRef") || ("REF-" + Math.floor(1000 + Math.random() * 9000));
  const cscId = db.auth.role === "operator" ? db.auth.cscId : (cust.cscId || "CSC-001");
  const appId = `RIVAN-2026-${String(db.applications.length + 1).padStart(4, "0")}`;

  const appObj = {
    id: appId, customerId: cust.id, customerName: cust.name, customerMobile: cust.mobile,
    serviceId: srv.id, serviceName: srv.name, amount: amt, paymentMode: mode,
    paymentRef: ref, paymentStatus: mode === "Cash" ? "Pending Verification" : "Verified",
    status, cscId, operatorId: db.auth.userId, operatorName: db.auth.userName,
    date: todayStr(), notes: val("apNote"),
    history: [{ status, by: db.auth.userName, time: nowStr() }]
  };
  db.applications.unshift(appObj);

  if (status === "Completed") recordAutoIncome(appObj);
  db.smsLogs.unshift({
    id: "SMS-" + (db.smsLogs.length + 1), to: cust.mobile, customer: cust.name,
    event: "Application Submitted", channel: "WhatsApp",
    msg: `Namaste ${cust.name}, aapka ${srv.name} (${appId}) ₹${amt} ke saath register ho gaya hai.`,
    time: nowStr()
  });

  saveDB("Application Created", "Applications", `${appId} (${srv.name}) - ₹${amt}`);
  closeModal();
  render();
  openReceiptModal(appId);
}

function recordAutoIncome(appObj) {
  if (db.incomes.some(i => i.title.includes(appObj.id))) return;
  db.incomes.unshift({
    id: "INC-" + String(db.incomes.length + 1).padStart(3, "0"),
    title: `App: ${appObj.id} (${appObj.serviceName})`,
    category: "Service Income", amount: appObj.amount, mode: appObj.paymentMode,
    ref: appObj.paymentRef, cscId: appObj.cscId, operator: appObj.operatorName,
    date: todayStr(), auto: true
  });
}

  openModal(`↩️ New ${type} Request`, `

  `);
}
function saveRequest(type) {
  const appId = val("rqApp"), reason = val("rqReason");
  if (!reason) return toast("Reason likhna zaroori hai");
  const a = db.applications.find(x => x.id === appId);
  db.requests.unshift({ id: "REQ-" + String(db.requests.length + 1).padStart(3, "0"), type, appId, amount: a?.amount || 0, reason, by: db.auth.userName, cscId: a?.cscId || "CSC-001", date: todayStr(), status: "Pending" });
  db.notifications.unshift({ id: "NOT-" + Date.now(), title: `New ${type} Request`, msg: `${db.auth.userName} requested ${type} for ${appId}`, time: "Just now", read: false });
  saveDB(`${type} Requested`, "Requests", `${appId}: ${reason}`);
  closeModal(); render(); toast(`${type} request submitted!`);
}
function handleRequest(id, decision) {
  const r = db.requests.find(x => x.id === id);
  r.status = decision;
  if (decision === "Approved") {
    const a = db.applications.find(x => x.id === r.appId);
    if (a) a.status = r.type === "Refund" ? "Refunded" : "Cancelled";
  }
  saveDB(`${r.type} ${decision}`, "Requests", `${r.appId} (${r.id})`);
  render(); toast(`Request ${decision}!`);
}

function markAttendance(dir) {
  const today = todayStr();
  const time = new Date().toTimeString().slice(0, 5);
  let rec = db.attendance.find(a => a.operatorId === db.auth.userId && a.date === today);
  if (dir === "in") {
    if (rec) return toast("Aaj ka Check-In pehle hi ho chuka hai!");
    const isLate = time > db.settings.checkInTime;
    db.attendance.unshift({ id: "ATT-" + Date.now(), operatorId: db.auth.userId, operatorName: db.auth.userName, cscId: db.auth.cscId, date: today, checkIn: time, checkOut: "", status: isLate ? "Late" : "Present", photoNote: "Mobile Timestamp Verified" });
    saveDB("Check-In", "Attendance", `${db.auth.userName} at ${time}`);
    render(); toast(`Checked-In at ${time}`);
  } else {
    if (!rec) return toast("Pehle Check-In karein!");
    rec.checkOut = time;
    saveDB("Check-Out", "Attendance", `${db.auth.userName} at ${time}`);
    render(); toast(`Checked-Out at ${time}`);
  }
}

function modalNewLeave() {
  openModal("🗓️ Apply Leave", `
    <div class="formgrid">
      <div class="field"><label>Leave Type</label><select id="lvType"><option>Casual Leave</option><option>Sick Leave</option><option>Emergency</option></select></div>
      <div class="field"><label>Pay Type</label><select id="lvPaid"><option value="1">Paid Leave</option><option value="0">Unpaid Leave</option></select></div>
      <div class="field"><label>From Date</label><input id="lvFrom" type="date" value="${todayStr()}"></div>
      <div class="field"><label>To Date</label><input id="lvTo" type="date" value="${todayStr()}"></div>
      <div class="field full"><label>Reason *</label><input id="lvReason" placeholder="Reason for leave"></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLeave()">Submit Leave</button></div>
  `);
}
function saveLeave() {
  const reason = val("lvReason");
  if (!reason) return toast("Reason required");
  db.leaves.unshift({ id: "LV-" + Date.now(), operatorId: db.auth.userId, operatorName: db.auth.userName, type: val("lvType"), from: val("lvFrom"), to: val("lvTo"), reason, paid: val("lvPaid") === "1", status: "Pending" });
  saveDB("Leave Applied", "Leave", `${db.auth.userName}: ${reason}`);
  closeModal(); render(); toast("Leave request sent!");
}
function decideLeave(id, st) {
  const l = db.leaves.find(x => x.id === id);
  l.status = st;
  saveDB("Leave " + st, "Leave", l.operatorName);
  render(); toast(`Leave ${st}`);
}

function modalGenerateSalary() {
  openModal("💵 Generate Monthly Salary", `
    <div class="formgrid">
      <div class="field full"><label>Select Operator</label><select id="pyOp">${db.operators.map(o=>`<option value="${o.id}" data-sal="${o.basicSalary}">${esc(o.name)} (Basic: ₹${o.basicSalary})</option>`).join("")}</select></div>
      <div class="field"><label>Month</label><input id="pyMonth" type="month" value="2026-11"></div>
      <div class="field"><label>Bonus (₹)</label><input id="pyBonus" type="number" value="0"></div>
      <div class="field"><label>Deduction (₹)</label><input id="pyDed" type="number" value="0"></div>
      <div class="field"><label>Advance Adjusted (₹)</label><input id="pyAdv" type="number" value="0"></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSalary()">Generate Payslip</button></div>
  `);
}
function saveSalary() {
  const op = db.operators.find(o => o.id === val("pyOp"));
  const bonus = Number(val("pyBonus") || 0), ded = Number(val("pyDed") || 0), adv = Number(val("pyAdv") || 0);
  const net = op.basicSalary + bonus - ded - adv;
  db.payrolls.unshift({ id: "PAY-" + (db.payrolls.length + 1), operatorId: op.id, operatorName: op.name, month: val("pyMonth"), basic: op.basicSalary, bonus, deduction: ded, advance: adv, net, status: "Paid" });
  saveDB("Salary Generated", "Payroll", `${op.name} - ₹${net}`);
  closeModal(); render(); toast("Salary processed!");
}
function openPayslip(id) {
  const p = db.payrolls.find(x => x.id === id);
  openModal("📄 Salary Payslip", `
    <div class="receipt-paper" id="printArea">
      <h2 style="text-align:center">${esc(db.branding.appName)} — PAYSLIP</h2>
      <p style="text-align:center;font-size:12px;margin-bottom:12px">Salary Month: ${p.month}</p>
      <div class="r-row"><span>Employee:</span><b>${esc(p.operatorName)} (${p.operatorId})</b></div>
      <div class="r-row"><span>Basic Salary:</span><span>₹${p.basic}</span></div>
      <div class="r-row"><span>Bonus:</span><span>+₹${p.bonus}</span></div>
      <div class="r-row"><span>Deductions:</span><span>-₹${Number(p.deduction)+Number(p.advance)}</span></div>
      <div class="r-row" style="font-size:15px;border-top:2px solid #111;margin-top:8px"><span>NET PAYABLE:</span><b>₹${p.net}</b></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="window.print()">🖨️ Print</button><button class="btn" onclick="closeModal()">Close</button></div>
  `);
}

function modalNewDocument() {
  const custs = scopedCustomers();
  openModal("📁 Add Document Record", `
    <div class="formgrid">
      <div class="field full"><label>Customer</label><select id="dcCust">${custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Service</label><input id="dcSrv" value="Income Certificate"></div>
      <div class="field"><label>Document Type *</label><input id="dcType" placeholder="e.g. Aadhaar / Ration Card"></div>
      <div class="field"><label>Expiry Date</label><input id="dcExp" type="date"></div>
      <div class="field"><label>Version</label><input id="dcVer" value="v1"></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveDocument()">Save Record</button></div>
  `);
}
function saveDocument() {
  const cust = db.customers.find(c => c.id === val("dcCust"));
  const docType = val("dcType");
  if (!docType) return toast("Document type required");
  db.documents.unshift({ id: "DOC-" + (db.documents.length + 1), customerId: cust.id, customerName: cust.name, service: val("dcSrv"), docType, expiry: val("dcExp"), version: val("dcVer"), uploadedBy: db.auth.userName, date: todayStr() });
  saveDB("Document Logged", "Documents", `${cust.name} - ${docType}`);
  closeModal(); render(); toast("Document record saved!");
}

function modalSendSMS() {
  openModal("💬 Send Notification", `
    <div class="formgrid">
      <div class="field"><label>Mobile Number *</label><input id="smTo" type="tel" placeholder="98XXXXXXXX"></div>
      <div class="field"><label>Channel</label><select id="smCh"><option>WhatsApp</option><option>SMS (Backend Gateway)</option></select></div>
      <div class="field full"><label>Message *</label><textarea id="smMsg" rows="3">Namaste, RIVAN CSC se aapka document ready hai. Kripya center se collect karein.</textarea></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="sendSMS()">Send & Log</button></div>
  `);
}
function sendSMS() {
  const to = val("smTo"), msg = val("smMsg"), ch = val("smCh");
  if (!to || !msg) return toast("Mobile aur message required");
  db.smsLogs.unshift({ id: "SMS-" + Date.now(), to, customer: "Customer", event: "Manual Alert", channel: ch, msg, time: nowStr() });
  saveDB("Message Sent", "Notifications", `${ch} to ${to}`);
  closeModal(); render();
  if (ch === "WhatsApp") window.open(`https://wa.me/91${to.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, "_blank");
  toast("Message logged!");
}

function saveBranding() {
  db.branding.appName = val("bName") || "RIVAN CSC Manager";
  db.branding.tagline = val("bTag");
  db.branding.primary = val("bColor");
  db.branding.theme = val("bTheme");
  db.branding.footer = val("bFooter");
  saveDB("Branding Updated", "Branding", db.branding.appName);
  render(); toast("Branding applied!");
}
function saveSystemSettings() {
  db.settings.checkInTime = val("sIn");
  db.settings.checkOutTime = val("sOut");
  db.settings.graceMinutes = Number(val("sGrace"));
  db.settings.expenseApprovalLimit = Number(val("sExpLim"));
  saveDB("Settings Updated", "Settings", "System rules updated");
  toast("System rules saved!");
}

function downloadBackupJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `RIVAN_CSC_Backup_${todayStr()}.json`;
  a.click();
  toast("Full JSON Backup downloaded!");
}
function createSnapshot() {
  db.backups.unshift({ id: "BKP-" + Date.now(), date: nowStr(), type: "Manual Local Snapshot", by: db.auth.userName, status: "Saved" });
  saveDB("Backup Snapshot", "Security", "Manual snapshot created");
  render(); toast("Local backup snapshot saved!");
}
function resetDemoData() {
  if (!confirm("Kya aap saara local data reset karke default demo data load karna chahte hain?")) return;
  db = getDefaultDB();
  saveDB();
  render();
  toast("App reset to fresh demo state!");
}

function filterList(inputId, tbodyId) {
  const q = val(inputId).toLowerCase();
  document.querySelectorAll(`#${tbodyId} tr`).forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}
function filterCards(inputId, gridId) {
  const q = val(inputId).toLowerCase();
  document.querySelectorAll(`#${gridId} .srv-item`).forEach(card => {
    card.style.display = card.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

// ==================== MASTER RENDER ====================
function render() {
  applyBranding();
  const root = document.getElementById("root");
  if (!db.auth.loggedIn) {
    root.innerHTML = renderLogin();
    return;
  }

  const menu = getMenu();
  const allItems = menu.flatMap(g => g.items);
  const currentItem = allItems.find(i => i.id === ui.view) || allItems[0];
  const unreadCount = db.notifications.filter(n => !n.read).length;

  const viewMap = {
    dashboard: viewDashboard, cscs: viewCSCs, operators: viewOperators,
    customers: viewCustomers, applications: viewApplications, services: viewServices,
    finance: viewFinance, payments: viewPayments, requests: viewRequests,
    attendance: viewAttendance, leaves: viewLeavesSection, payroll: viewPayroll,
    reports: viewReports, documents: viewDocuments, notifications: viewNotifications,
    branding: viewBranding, security: viewSecurity, profile: viewProfile
  };

  root.innerHTML = `
  <div class="app">
    <div class="backdrop ${ui.drawerOpen ? 'show' : ''}" onclick="ui.drawerOpen=false;render()"></div>
    <aside class="sidebar ${ui.drawerOpen ? 'open' : ''}">
      <div class="brand">
        <div class="logo">CSC</div>
        <div><h1>${esc(db.branding.appName)}</h1><small>${db.auth.role === 'admin' ? 'Super Admin Panel' : esc(cscName(db.auth.cscId))}</small></div>
      </div>
      ${menu.map(g => `
        <div class="nav-group">${g.group}</div>
        <nav class="nav">
          ${g.items.map(i => `
            <button class="${ui.view === i.id ? 'active' : ''}" onclick="go('${i.id}')">
              <span>${i.icon}</span> ${i.label}
              ${i.badge ? `<span class="nav-badge">${i.badge}</span>` : ""}
            </button>`).join("")}
        </nav>`).join("")}
      <div style="margin-top:20px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.12)">
        <button class="nav" style="width:100%;color:#ffb4b4;padding:11px 12px;background:transparent;text-align:left;border-radius:12px" onclick="logout()">🚪 Logout / Switch Role</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div class="top-left">
          <button class="menu-btn" onclick="ui.drawerOpen=!ui.drawerOpen;render()">☰</button>
          <h2>${currentItem.icon} ${currentItem.label}</h2>
        </div>
        <div class="top-right">
          <button class="iconbtn" title="Theme" onclick="db.branding.theme=db.branding.theme==='dark'?'light':'dark';saveDB();render()">${db.branding.theme==='dark'?'☀️':'🌙'}</button>
          <button class="iconbtn" title="Alerts" onclick="go('notifications')">🔔${unreadCount ? '<span class="dot"></span>' : ''}</button>
          <button class="avatar" onclick="logout()">${db.auth.role === 'admin' ? '👑 Admin' : '👨‍💼 Op'}</button>
        </div>
      </header>

      <section class="content">
        ${(viewMap[ui.view] || viewDashboard)()}
      </section>
    </main>

    <!-- Native Mobile App Bottom Navigation -->
    <nav class="bottom">
      <button class="${ui.view==='dashboard'?'active':''}" onclick="go('dashboard')"><span>🏠</span>Home</button>
      <button class="${ui.view==='customers'?'active':''}" onclick="go('customers')"><span>👥</span>Customers</button>
      <button class="fab" onclick="modalNewApplication()" title="New Application">＋</button>
      <button class="${ui.view==='applications'?'active':''}" onclick="go('applications')"><span>📄</span>Apps</button>
      <button class="${ui.view==='reports'?'active':''}" onclick="go('reports')"><span>📊</span>Reports</button>
    </nav>
  </div>`;
}

render();
</script>
